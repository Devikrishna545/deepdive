name: ci

on:
  push:
  pull_request:
  workflow_dispatch: # run manually from the Actions tab to also test live Mesh access

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Mesh-only rule (every LLM call goes through Mesh API)
        run: python scripts/check_mesh_only.py

      - name: Lint
        run: ruff check .

      - name: Tests (offline, fake Mesh)
        run: pytest

      # Spends a fraction of a cent, so it runs only on a manual trigger, never on every push.
      - name: Mesh connectivity (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          MESH_API_KEY: ${{ secrets.MESH_API_KEY }}
        run: python -m scripts.smoke_mesh

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
