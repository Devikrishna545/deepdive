[project]
name = "deepdive"
version = "0.1.0"
description = "Self-verifying multi-agent research analyst (Agent Arena 2026, Track 01)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
